name: Release

# Se dispara cuando subes un tag de versión (ej: v1.0.80).
# Flujo del dev: `npm version patch && git push --follow-tags` → GitHub
# compila y publica el release automáticamente en sus servidores limpios
# (sin los problemas de hdiutil/Google Drive/volúmenes del Mac local).
#
# Permite también compilar Windows "gratis" (runner Windows de GitHub),
# algo que desde un Mac requeriría Wine.

on:
  push:
    tags:
      - 'v*.*.*'
  # Permite dispararlo a mano desde la pestaña Actions de GitHub también.
  workflow_dispatch:

permissions:
  contents: write   # necesario para que electron-builder cree el Release

jobs:
  # ─────────────────────────────  macOS  ─────────────────────────────
  release-mac:
    # macos-15-intel: los runners Mac arm64 (macos-latest) se quedan sin
    # capacidad y el job no consigue máquina en 15 min (v1.0.164, 3 intentos).
    # La app no tiene módulos nativos y no se firma, así que desde Intel se
    # compilan igual los zips arm64 y x64.
    runs-on: macos-15-intel
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build + publicar (Mac, zip arm64 + x64)
        run: npm run release:mac
        env:
          # GitHub provee este token automáticamente — no hay que crear secret.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────  Windows  ────────────────────────────
  # Bonus: compila el .exe en un runner Windows real (sin Wine).
  # Publica al MISMO release que el job de Mac (electron-builder agrega
  # los assets al release existente del tag).
  #
  # needs: release-mac → corre DESPUÉS de Mac. Si ambos corrieran en
  # paralelo, los dos intentan CREAR el release del tag a la vez y uno
  # recibe 422 "already_exists" (la carrera que dejó v1.0.99 sin .exe).
  # Serial: Mac crea el release, Windows solo le agrega su .exe.
  release-win:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build + publicar (Windows, NSIS x64)
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
